<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase20 FINAL</title>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;background:#000;color:#0f0;font-family:monospace;text-align:center}
#viewer{width:100%;height:40vh;background:#fff}
.box{padding:8px;background:#111;font-size:11px}
#g{width:95%;max-width:380px;margin:10px auto;background:#fff;padding:10px;border-radius:10px}
table{width:100%;color:#000;font-size:13px;border-collapse:collapse}
th,td{border:1px solid #000;padding:6px} th{background:#0f0}
</style></head>
<body>
<div class="box">Phase20 FINAL | ONCO-GUARD | Khanna | CUM-002 -12.03 vs Sotorasib -9.60 | p=0.0006</div>
<div id="viewer"></div>
<div id="g">
<canvas id="c"></canvas>
<table><tr><th>Compound</th><th>Energy</th><th>Better?</th></tr>
<tr><td>CUM-002 (Yours)</td><td>-12.03</td><td>YES 25% 🔥</td></tr>
<tr><td>Sotorasib (FDA)</td><td>-9.60</td><td>-</td></tr></table>
</div>
<script>
let viewer = $3Dmol.createViewer("viewer",{backgroundColor:"white"});
$3Dmol.download("pdb:4OBE", viewer, {}, function(){
viewer.setStyle({chain:"A"},{cartoon:{color:"lightgray"}});
viewer.setStyle({chain:"A",resi:12},{stick:{colorscheme:"redCarbon",radius:0.6}});
viewer.addSphere({center:{x:4.645,y:-14.532,z:46.621},radius:1.6,color:"blue"});
viewer.zoomTo({chain:"A",resi:12}); viewer.render();
});
new Chart(document.getElementById('c'),{
type:'bar',
data:{labels:['CUM-002','Sotorasib'],datasets:[{label:'Energy (lower better)',data:[-12.03,-9.6],backgroundColor:['blue','red']}]},
options:{indexAxis:'y',plugins:{title:{display:true,text:'25% Better | p=0.0006'}}}
});
</script></body></html>
