<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase19 CLEAN</title>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<style>body{margin:0;background:#000;text-align:centeHm bro but eh phase 19 jo banhea save kive krn and aghe start kive Krnar} #viewer{width:100%;height:90vh;background:#fff} .h{padding:6px;background:#111;color:#0f0;font:12px monospace}</style>
</head>
<body>
<div class="h">Phase19 CLEAN FINAL | 4OBE Chain A | CUM-002 -12.03 | Khanna | Phone Only</div>
<div id="viewer"></div>
<script>
let viewer = $3Dmol.createViewer("viewer",{backgroundColor:"white"});
fetch("https://files.rcsb.org/download/4OBE.pdb").then(r=>r.text()).then(pdb=>{
viewer.addModel(pdb,"pdb");
viewer.setStyle({chain:"A"},{cartoon:{color:"lightgray"}});
viewer.setStyle({chain:"A",resi:12},{stick:{colorscheme:"redCarbon",radius:0.5}});
viewer.addSphere({center:{x:4.645,y:-14.532,z:46.621},radius:1.6,color:"blue",opacity:1});
viewer.addLabel("Blue=CUM-002 -12.03 | CYS12",{position:{x:4.645,y:-14.532,z:46.621},backgroundColor:"black",fontColor:"white",fontSize:11});
viewer.zoomTo({chain:"A",resi:12});viewer.render();
});
</script>
</body>
